<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Demo-as-a-Prompt: sandbox edition</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>

  <rect x="30" y="200" width="150" height="90" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="105" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">You</text>
  <text x="105" y="262" text-anchor="middle" font-size="12" fill="#334155">"Spin up a demo</text>
  <text x="105" y="278" text-anchor="middle" font-size="12" fill="#334155">for 2 hours"</text>

  <rect x="240" y="150" width="250" height="190" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="365" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">Agent (Strands + Bedrock Claude)</text>
  <text x="365" y="204" text-anchor="middle" font-size="12" fill="#334155">AgentCore-ready entrypoint (tested locally)</text>
  <text x="365" y="236" text-anchor="middle" font-size="12" fill="#334155">list_templates · estimate_cost</text>
  <text x="365" y="256" text-anchor="middle" font-size="12" fill="#334155">deploy_demo · validate_demo</text>
  <text x="365" y="276" text-anchor="middle" font-size="12" fill="#334155">list_demos · teardown_demo</text>
  <text x="365" y="296" text-anchor="middle" font-size="12" fill="#334155">reap_expired</text>
  <text x="365" y="324" text-anchor="middle" font-size="11" fill="#9a3412">picks a catalog template + TTL, never writes code</text>

  <rect x="570" y="90" width="200" height="90" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="670" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">Template catalog</text>
  <text x="670" y="146" text-anchor="middle" font-size="12" fill="#334155">hello-api · text-toolkit</text>
  <text x="670" y="164" text-anchor="middle" font-size="12" fill="#334155">unit-converter</text>

  <rect x="570" y="230" width="200" height="110" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="670" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">AWS Lambda</text>
  <text x="670" y="284" text-anchor="middle" font-size="12" fill="#334155">+ public Function URL</text>
  <text x="670" y="304" text-anchor="middle" font-size="12" fill="#334155">tags: dap:managed,</text>
  <text x="670" y="322" text-anchor="middle" font-size="12" fill="#334155">dap:expires-at</text>

  <rect x="570" y="390" width="200" height="90" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text x="670" y="422" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">TTL guard</text>
  <text x="670" y="446" text-anchor="middle" font-size="12" fill="#334155">after expiry: HTTP 410</text>
  <text x="670" y="464" text-anchor="middle" font-size="12" fill="#334155">reaper deletes (managed only)</text>

  <rect x="830" y="230" width="140" height="110" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="900" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">Live URL</text>
  <text x="900" y="294" text-anchor="middle" font-size="12" fill="#334155">validated</text>
  <text x="900" y="312" text-anchor="middle" font-size="12" fill="#334155">by the agent</text>

  <line x1="180" y1="245" x2="238" y2="245" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="490" y1="215" x2="568" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="490" y1="270" x2="568" y2="270" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="770" y1="285" x2="828" y2="285" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="670" y1="340" x2="670" y2="388" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="490" y1="320" x2="568" y2="425" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="500" y="505" text-anchor="middle" font-size="12" fill="#475569">Full edition (full_edition/) swaps Lambda for API Gateway + DynamoDB via CDK and the soft TTL for an EventBridge reaper.</text>
</svg>
